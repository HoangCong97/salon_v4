<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <!-- Mobile Viewport with Safe Area Fit -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Việt POS</title>
  <link rel="icon" type="image/png" href="/favicon.png" />

  <!-- Web App Manifest for Android Chrome (Standalone Mode) -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- Apple iOS Standalone Web App Meta Tags (Full Screen without Safari UI) -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Việt POS" />
  <link rel="apple-touch-icon" href="/favicon.png" />

  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- iOS Standalone PWA Viewport Height Engine -->
  <script>
    (function () {
      function syncAppHeight() {
        var isIOS =
          /iPad|iPhone|iPod/.test(navigator.userAgent) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        var isStandalone =
          window.navigator.standalone ||
          window.matchMedia('(display-mode: standalone)').matches;

        var h = window.innerHeight;
        if (isIOS && isStandalone) {
          var isPortrait = window.matchMedia('(orientation: portrait)').matches;
          h = isPortrait
            ? Math.max(window.screen.height, window.screen.width)
            : Math.min(window.screen.height, window.screen.width);
        }
        document.documentElement.style.setProperty('--app-height', h + 'px');
      }

      syncAppHeight();
      window.addEventListener('resize', syncAppHeight);
      window.addEventListener('orientationchange', syncAppHeight);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', syncAppHeight);
      }
      window.addEventListener('scroll', function () {
        if (window.scrollY !== 0 || window.scrollX !== 0) {
          window.scrollTo(0, 0);
        }
      });
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
